<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hackathon Journal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="{{ url_for('log.index') }}">hackjournal</a>
    <nav class="topnav">
      <a href="{{ url_for('log.index') }}" class="{% if request.endpoint and request.endpoint.startswith('log.') and request.endpoint != 'log.new_hackathon' %}is-active{% endif %}">Dashboard</a>
      <a href="{{ url_for('insights.index') }}" class="{% if request.endpoint and request.endpoint.startswith('insights.') %}is-active{% endif %}">Insights</a>
      <a href="{{ url_for('log.new_hackathon') }}" class="nav-cta">Add entry</a>
    </nav>
  </header>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
