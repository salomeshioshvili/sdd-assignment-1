{% extends "base.html" %}
{% block title %}Checklist: {{ h.name }}{% endblock %}
{% block content %}
<div class="panel content-panel">
  <div class="page-head">
    <p class="page-kicker">Prep list</p>
    <h1>Checklist for <span class="highlight">{{ h.name }}</span></h1>
    <p class="page-lead">{{ h.mode }} · tick these off before you ship.</p>
  </div>
  <ul class="check-list">{% for item in items %}<li>{{ item }}</li>{% endfor %}</ul>
  <a class="back-link" href="{{ url_for('insights.index') }}">← Back to insights</a>
</div>
{% endblock %}
